services:
  backend:
    build: .
    container_name: finsolve_rag_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      # Persistent storage for ChromaDB and data folders inside container
      - ./data:/app/data
      # Mount src for live debugging
      - ./src:/app/src
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsolve_rag_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always